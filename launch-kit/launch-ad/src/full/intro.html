<canvas id="c" width="1080" height="1920"></canvas>
<script src="style.js"></script>
<script>
/* OPENING — full-screen kinetic type, Apple-reveal logic.

   Letters do not fade up. Each glyph is its own object with a 3D start
   scattered across (and in front of) the frame, a staggered arrival, an
   overshoot, and a settle. They streak past camera before assembling, which is
   what gives an Apple product intro its snap. Motion blur comes from four
   sub-samples per frame, so fast glyphs smear the way real ones do.        */
const W=1080,H=1920,CX=W/2,CY=H/2,DUR=6.4;
const c=document.getElementById('c'),g=c.getContext('2d');
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>cl((t-a)/(b-a),0,1);
const eO=t=>1-Math.pow(1-t,3);
// overshoot: arrives fast, passes the mark, settles back
function back(t,s){s=s===undefined?1.70:s;return 1+ (s+1)*Math.pow(t-1,3) + s*Math.pow(t-1,2)}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(77021);

const WORD='milton';
const FS=318;                       // final glyph size
let LAY=null;                       // per-glyph layout + flight

function layout(){
  g.font=`600 ${FS}px "Bodoni Moda", Georgia, serif`;
  const ws=[...WORD].map(ch=>g.measureText(ch).width);
  const track=-FS*0.012;
  const total=ws.reduce((a,b)=>a+b,0)+track*(WORD.length-1);
  let x=CX-total/2;
  const L=[];
  [...WORD].forEach((ch,i)=>{
    const cx=x+ws[i]/2;
    x+=ws[i]+track;
    // each glyph starts somewhere else entirely, in front of or behind camera
    const dir=R()*6.283, dist=900+R()*1500;
    L.push({
      ch, x:cx, y:CY-FS*0.06, w:ws[i],
      sx:CX+Math.cos(dir)*dist, sy:CY+Math.sin(dir)*dist*1.25,
      sz:0.25+R()*2.6,                       // scale it flies in at
      rot:(R()*2-1)*0.9,
      t0:0.55+i*0.085+R()*0.05,              // staggered arrival
      dur:0.78+R()*0.22,
    });
  });
  return L;
}

function drawAt(t){
  refGround(g,W,H);
  refWaves(g,W,H,t, seg(t,1.6,3.2)*0.85);
  if(!LAY) LAY=layout();

  // depth streaks rushing past, so the frame has motion before the type lands
  const st=seg(t,0.15,2.6)*(1-seg(t,2.6,3.4));
  if(st>0.002){
    g.save();g.globalCompositeOperation='lighter';
    for(let i=0;i<70;i++){
      const p=((i*0.137 + t*0.85)%1);
      const a=Math.sin(p*Math.PI)*st*0.95;
      if(a<=0.01)continue;
      const ang=(i/70)*6.283, rad=120+p*1500;
      const x=CX+Math.cos(ang)*rad, y=CY+Math.sin(ang)*rad*1.3;
      g.strokeStyle=i%7===0?LIME:'#2FA1A6';
      g.globalAlpha=a;g.lineWidth=2.5+p*4.5;
      g.beginPath();g.moveTo(x,y);
      g.lineTo(CX+Math.cos(ang)*(rad-90-p*220), CY+Math.sin(ang)*(rad-90-p*220)*1.3);
      g.stroke();
    }
    g.restore();
  }

  // the glyphs
  g.textAlign='center';g.textBaseline='middle';
  for(const L of LAY){
    const p=cl((t-L.t0)/L.dur,0,1);
    if(p<=0)continue;
    const e=back(p);
    const x=L.sx+(L.x-L.sx)*e;
    const y=L.sy+(L.y-L.sy)*e;
    const sc=L.sz+(1-L.sz)*e;
    const rot=L.rot*(1-e);
    const a=cl(p*3.2,0,1);
    g.save();
    g.globalAlpha=a*(1-seg(t,5.9,6.4));
    g.translate(x,y);g.rotate(rot);g.scale(sc,sc);
    g.font=`600 ${FS}px "Bodoni Moda", Georgia, serif`;
    // brand ramp across the assembled word
    const u=(L.x-(CX-540))/1080;
    const gr=g.createLinearGradient(-L.w/2,0,L.w/2,0);
    gr.addColorStop(0, `hsl(${192-u*70}, ${58+u*12}%, ${44+u*22}%)`);
    gr.addColorStop(1, `hsl(${192-(u+0.14)*70}, ${58+u*12}%, ${46+u*24}%)`);
    g.shadowColor='rgba(70,190,215,.45)';g.shadowBlur=40*(1-p)+14;
    g.fillStyle=gr;
    g.fillText(L.ch,0,0);
    g.restore();
  }

  // the swirl crosses the settled word
  const sw=seg(t,2.9,4.5);
  if(sw>0&&sw<1){
    g.save();g.globalCompositeOperation='lighter';
    const head=(-0.3+sw*1.7)*W;
    const gr=g.createLinearGradient(head-W*0.26,0,head+W*0.26,0);
    gr.addColorStop(0,'rgba(255,255,255,0)');
    gr.addColorStop(0.46,'rgba(215,248,255,.42)');
    gr.addColorStop(0.52,'rgba(255,255,255,.72)');
    gr.addColorStop(0.60,'rgba(200,229,114,.45)');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr;
    g.fillRect(0,CY-FS*0.62,W,FS*1.1);
    g.restore();
  }

  // the descriptor, letterspaced, arriving after the word settles
  const da=seg(t,3.5,4.3)-seg(t,5.9,6.4);
  if(da>0.002){
    g.save();g.globalAlpha=cl(da,0,1);
    g.font='400 46px Jost, system-ui, sans-serif';
    const s='M I L T O N   N A T I O N   A L U M N I';
    const ws=[...s].map(ch=>g.measureText(ch).width);
    const tr=6.5, tot=ws.reduce((a,b)=>a+b,0)+tr*(s.length-1);
    let x=CX-tot/2;g.textAlign='left';
    g.fillStyle='rgba(226,240,246,.94)';
    [...s].forEach((ch,i)=>{g.fillText(ch,x,CY+FS*0.44);x+=ws[i]+tr});
    g.textAlign='center';g.restore();
  }

  // punch through into the film
  const bl=seg(t,5.5,6.4);
  if(bl>0){
    g.save();g.globalCompositeOperation='lighter';g.globalAlpha=Math.pow(bl,1.8);
    const gr=g.createRadialGradient(CX,CY,0,CX,CY,H*0.75*bl+60);
    gr.addColorStop(0,'rgba(230,250,255,.96)');
    gr.addColorStop(0.5,'rgba(90,200,230,.34)');
    gr.addColorStop(1,'rgba(0,120,160,0)');
    g.fillStyle=gr;g.fillRect(0,0,W,H);g.restore();
  }
  const fi=1-seg(t,0,0.45);
  if(fi>0){g.save();g.globalAlpha=fi;g.fillStyle='#080A0C';g.fillRect(0,0,W,H);g.restore()}
}

const SUB=4, DT=1/30;               // four samples: the glyphs move fast
const acc=document.createElement('canvas');acc.width=W;acc.height=H;
const ag=acc.getContext('2d');
window.SEEK=function(t){
  ag.clearRect(0,0,W,H);ag.fillStyle='#000';ag.fillRect(0,0,W,H);
  for(let i=0;i<SUB;i++){
    drawAt(cl(t+(i/SUB-0.5)*DT,0,DUR));
    ag.globalAlpha=1/(i+1);ag.drawImage(c,0,0);ag.globalAlpha=1;
  }
  g.clearRect(0,0,W,H);g.drawImage(acc,0,0);
  return true;
};
window.DURATION=DUR;
(async()=>{ if(document.fonts&&document.fonts.ready) await document.fonts.ready;
  window.READY=true; SEEK(0); })();
</script></body></html>
