<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  #icon{position:absolute;left:50%;top:41%;width:430px;height:430px;transform:translate(-50%,-50%) scale(.82);
    border-radius:96px;opacity:0;z-index:20;
    box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 90px rgba(0,147,178,.5)}
  #streak{position:absolute;left:-40%;top:0;width:26%;height:100%;z-index:25;opacity:0;
    background:linear-gradient(100deg,transparent,rgba(212,235,142,.34) 45%,rgba(255,255,255,.5) 50%,rgba(212,235,142,.34) 55%,transparent);
    transform:skewX(-14deg)}
  #rays{position:absolute;left:50%;top:41%;width:1400px;height:1400px;transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg,transparent 0 10%,rgba(0,147,178,.14) 13%,transparent 17%,transparent 45%,rgba(22,92,125,.18) 50%,transparent 55%,transparent 78%,rgba(0,147,178,.12) 82%,transparent 86%);
    border-radius:50%;filter:blur(6px);z-index:5;opacity:0;transition:opacity 1s}
</style></head>
<body><div class="stage">
  <canvas class="bg" id="cv"></canvas>
  <div id="rays"></div>
  <img id="icon" src="appicon.png">
  <div id="streak"></div>
  <div class="cap" id="c1" style="top:63%">so we built a <span class="hi">nation</span></div>
  <div class="dip" id="dip"></div>
</div>
<script src="lib.js"></script>
<script>
/* SEG-02 · 4.0s · icon reveal with rays + lime light streak */
startWaves(document.getElementById('cv'));
dipIn(dip, .4);
at(.15, () => {
  icon.style.transition = 'opacity 1.1s ease, transform 3.6s cubic-bezier(.2,.6,.2,1)';
  icon.style.opacity = '1';
  icon.style.transform = 'translate(-50%,-50%) scale(1.0)';
  rays.style.opacity = '1';
});
(function spin(){ rays.animate([{rotate:'0deg'},{rotate:'40deg'}],{duration:4000,iterations:1,easing:'linear'}); })();
at(1.4, () => { streak.style.transition = 'left 1.1s cubic-bezier(.3,.4,.2,1), opacity .2s'; streak.style.opacity = '1'; streak.style.left = '120%'; });
at(2.5, () => streak.style.opacity = '0');
at(1.0, () => c1.classList.add('rise'));
at(3.5, () => c1.classList.add('fadeout'));
dipOut(dip, 3.68, .3);
</script></body></html>
