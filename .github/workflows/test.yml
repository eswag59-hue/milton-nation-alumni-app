name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use the runner image's default Xcode — it's the one whose iOS simulator
      # runtimes are installed. Pinning an older Xcode (16.0) left the scheme's
      # iOS 18 deployment target with no eligible simulator destination.
      - name: Show Xcode version
        run: xcodebuild -version

      # Debug.xcconfig / Release.xcconfig hold local secrets and are gitignored,
      # but the project's baseConfigurationReference requires the files to exist.
      # Empty stubs let CI build with the project's own settings.
      - name: Create xcconfig stubs (real ones are gitignored)
        run: |
          mkdir -p "Milton Nation Alumni App/Config"
          printf '// CI stub — the real xcconfig is local-only and gitignored\n' \
            | tee "Milton Nation Alumni App/Config/Debug.xcconfig" \
            > "Milton Nation Alumni App/Config/Release.xcconfig"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Milton Nation Alumni App.xcodeproj" \
            -scheme "Milton Nation Alumni App"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "Milton Nation Alumni App.xcodeproj" \
            -scheme "Milton Nation Alumni App" \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | xcpretty --color || exit ${PIPESTATUS[0]}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: "TestResults.xcresult"
          retention-days: 7
